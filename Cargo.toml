[package]
name = "brz-pattern-generator"
version = "0.3.0"
edition = "2021"
description = "Angled brick patterns for Brickadia, held on rigid bearings, saved as prefabs"
license = "MIT"

[lib]
name = "patterngen"
path = "src/lib.rs"

[[bin]]
name = "BRZPatternGenerator"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "selftest"
path = "src/bin/selftest.rs"

[[bin]]
name = "testpack"
path = "src/bin/testpack.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:dirs"]

[dependencies]
brdb = "1.0.5"
eframe = { version = "0.33.3", optional = true, features = ["persistence"] }
egui = { version = "0.33.3", optional = true }
dirs = { version = "5", optional = true }

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5.4.1", features = ["windows-win"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[[bin]]
name = "joinpack"
path = "src/bin/joinpack.rs"

[[bin]]
name = "pillarpack"
path = "src/bin/pillarpack.rs"

