name: Build and self-test

# Runs on every push, and can be started by hand from the Actions tab
# ("Run workflow"). Stage 1 has no window yet: the build runs the self-test
# and makes the in-game test pack, which appears as a download at the bottom
# of the run's page under "Artifacts".
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Self-test (overlap / bearing / read-back check on 2,000+ layouts)
        run: cargo run --release --bin selftest
      - name: Make the in-game test pack
        run: cargo run --release --bin testpack
      - uses: actions/upload-artifact@v4
        with:
          name: PatternGenerator-testpack
          path: testpack/*.brz
