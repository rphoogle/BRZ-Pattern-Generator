name: Build Windows .exe

# Runs on every push, and can be started by hand from the Actions tab
# ("Run workflow"). The finished BRZPatternGenerator.exe appears as a
# download at the bottom of the run's page under "Artifacts".
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Self-test (overlap / bearing / read-back check on 5,000+ layouts)
        run: cargo run --release --no-default-features --bin selftest
      - name: Build the program
        run: cargo build --release --bin BRZPatternGenerator
      - uses: actions/upload-artifact@v4
        with:
          name: BRZPatternGenerator-windows
          path: target/release/BRZPatternGenerator.exe
